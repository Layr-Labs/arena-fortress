[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfbench-toolkit"
version = "0.1.0"
description = "Analysis tools for Yukon Arena: Fortress (a harness challenge played in the game Dwarf Fortress) local runs: inspect, compare, snapshot"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dfbench-tk = "dfbench_toolkit.cli:main"

[tool.setuptools]
packages = ["dfbench_toolkit"]
