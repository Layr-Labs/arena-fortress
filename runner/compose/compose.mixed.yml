# Overlay on top of compose.real.yml: the real game server (DF) with the fake gateway (runner/fakes), so the server
# can be tested end to end without a model or a key: `dfbench local run --stack mixed ...`.
services:
  gateway:
    image: ${DFBENCH_FAKES_IMAGE:-s0run-fakes:latest}
    command: ["python3", "-u", "/fakes/fake_gateway.py", "--port", "8080"]
    user: nobody
    environment:
      FAKE_THROTTLE_S: ${FAKE_THROTTLE_S:-0}
      FAKE_COST_PER_CALL: ${FAKE_COST_PER_CALL:-}
      FAKE_USAGE_MISSING_AT: ${FAKE_USAGE_MISSING_AT:-}
