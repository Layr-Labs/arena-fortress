# Overlay for tests: runner/fakes stand in for gameapi/server and gateway/ (no DF, no provider, no key).
services:
  game:
    image: ${DFBENCH_FAKES_IMAGE:-s0run-fakes:latest}
    command: ["python3", "-u", "/fakes/fake_game.py", "--port", "8090"]
    environment:
      FAKE_SEC_PER_DAY: ${FAKE_SEC_PER_DAY:-0.01}
  gateway:
    image: ${DFBENCH_FAKES_IMAGE:-s0run-fakes:latest}
    command: ["python3", "-u", "/fakes/fake_gateway.py", "--port", "8080"]
    user: nobody                      # as the real gateway image runs
    environment:
      FAKE_REQUIRE_KEY: ${FAKE_REQUIRE_KEY:-0}
      FAKE_THROTTLE_S: ${FAKE_THROTTLE_S:-0}
      FAKE_COST_PER_CALL: ${FAKE_COST_PER_CALL:-}
      FAKE_USAGE_MISSING_AT: ${FAKE_USAGE_MISSING_AT:-}
